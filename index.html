```html
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <title>StarCard Legends</title>

    <link rel="stylesheet" href="style.css">

    <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>

<body>

    <div class="app">

        <header class="topbar">
            <div>
                <div class="logo">⭐ StarCard</div>
                <div class="subtitle">LEGENDS</div>
            </div>

            <div class="coins">
                💰 <span id="coins">0</span>
            </div>
        </header>


        <main>

            <section class="hero">
                <div class="hero-star">⭐</div>

                <h1>StarCard Legends</h1>

                <p>
                    Собирай легендарные карты
                    и создай свою коллекцию.
                </p>

                <button class="pack-button" id="openPack">
                    🎴 ОТКРЫТЬ ПАК
                </button>
            </section>


            <section class="stats">

                <div class="stat">
                    <span>🎴</span>
                    <strong id="cards">0</strong>
                    <small>Карт</small>
                </div>

                <div class="stat">
                    <span>⭐</span>
                    <strong>1</strong>
                    <small>Уровень</small>
                </div>

                <div class="stat">
                    <span>🏆</span>
                    <strong>0</strong>
                    <small>Побед</small>
                </div>

            </section>


            <section class="section">

                <h2>⚡ Быстрый доступ</h2>

                <div class="menu-grid">

                    <button class="menu-card">
                        <span>📚</span>
                        <b>Коллекция</b>
                        <small>Твои карты</small>
                    </button>

                    <button class="menu-card">
                        <span>🏆</span>
                        <b>Рейтинг</b>
                        <small>Лучшие игроки</small>
                    </button>

                    <button class="menu-card">
                        <span>🎁</span>
                        <b>Награды</b>
                        <small>Получи бонус</small>
                    </button>

                    <button class="menu-card">
                        <span>👤</span>
                        <b>Профиль</b>
                        <small>Твой аккаунт</small>
                    </button>

                </div>

            </section>

        </main>


        <nav class="bottom-nav">

            <button class="nav-item active">
                <span>🏠</span>
                <small>Главная</small>
            </button>

            <button class="nav-item">
                <span>📚</span>
                <small>Коллекция</small>
            </button>

            <button class="nav-item">
                <span>🎴</span>
                <small>Паки</small>
            </button>

            <button class="nav-item">
                <span>👤</span>
                <small>Профиль</small>
            </button>

        </nav>

    </div>


    <script src="app.js"></script>

</body>
</html>
```
