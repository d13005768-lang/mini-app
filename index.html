<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Username Finder</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 20px;
      background: var(--tg-theme-bg-color, #10131b);
      color: var(--tg-theme-text-color, #fff);
      font: 16px Arial, sans-serif;
    }

    main { max-width: 480px; margin: 0 auto; }
    h1 { font-size: 26px; }
    p { line-height: 1.5; }

    select, button {
      width: 100%;
      padding: 14px;
      margin: 8px 0;
      border: 0;
      border-radius: 12px;
      font-size: 16px;
    }

    select {
      background: var(--tg-theme-secondary-bg-color, #202637);
      color: var(--tg-theme-text-color, white);
    }

    button {
      background: var(--tg-theme-button-color, #5288ff);
      color: var(--tg-theme-button-text-color, white);
      cursor: pointer;
    }

    .item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 12px;
      margin-top: 9px;
      border-radius: 12px;
      background: var(--tg-theme-secondary-bg-color, #202637);
    }

    .name { font-size: 20px; font-weight: bold; }
    .note {
      font-size: 12px;
      color: var(--tg-theme-hint-color, #aab2c5);
      margin-top: 4px;
    }

    .copy {
      width: auto;
      flex-shrink: 0;
      margin: 0;
      padding: 10px 13px;
    }

    .hint { font-size: 13px; opacity: .8; }
  </style>
</head>
<body>
<main>
  <h1>✨ Username Finder</h1>
  <p>Редкие слова и красивые имена из пяти латинских букв.</p>

  <select id="style">
    <option value="all">Все категории</option>
    <option value="english">Редкие английские слова</option>
    <option value="russian">Русские слова латиницей</option>
    <option value="madeup">Выдуманные имена</option>
  </select>

  <button id="generate">Найти варианты</button>
  <p id="status" class="note" aria-live="polite"></p>
  <section id="results"></section>
  <p class="hint">
    Варианты не проверены в Telegram. Редкое слово не обязательно свободно.
  </p>
</main>

<script>
  const tg = window.Telegram?.WebApp;
  tg?.ready();
  tg?.expand();

  const words = {
    english: [
      "acorn", "aloft", "amber", "ashen", "axiom",
      "basil", "beryl", "brink", "cairn", "cedar",
      "chasm", "cider", "coral", "covet", "crane",
      "croft", "delft", "delta", "droll", "ember",
      "epoch", "facet", "fable", "feral", "fjord",
      "flint", "flora", "gazer", "gleny", "gloom",
      "havoc", "heron", "honey", "inlet", "ivory",
      "jaunt", "karma", "knoll", "lilac", "lumen",
      "maple", "mirth", "mocha", "mossy", "myrrh",
      "naive", "niche", "nymph", "ochre", "olive",
      "opium", "orbit", "otter", "oxide", "pansy",
      "pearl", "pecan", "pesto", "petal", "plume",
      "quail", "quirk", "realm", "relic", "rivet",
      "roost", "rowan", "sable", "satin", "sepia",
      "shire", "siren", "slate", "smirk", "sonar",
      "spelt", "spore", "sprig", "stork", "surge",
      "tacit", "tempo", "thrum", "topaz", "umbra",
      "vapor", "velum", "verve", "vigil", "waltz",
      "weald", "wisp", "woven", "xylem", "yearn",
      "yucca", "zesty", "zonal"
    ],

    russian: [
      "dacha", "davno", "dekor", "dengi", "dozhd",
      "duplo", "dyshi", "iskra", "kamin", "karta",
      "kazan", "kniga", "koala", "krasa", "krilo",
      "kusty", "laska", "lesok", "listy", "luchi",
      "lutik", "malva", "mango", "mecha", "metel",
      "mirny", "morel", "moroz", "motiv", "myata",
      "nevod", "norka", "oblak", "ogony", "okapi",
      "oseny", "otrad", "pchel", "pesny", "plamy",
      "polka", "prana", "prism", "radar", "radug",
      "reika", "riska", "rosha", "rubin", "rybak",
      "sazha", "sever", "siren", "skala", "slava",
      "smola", "snezh", "sonet", "sosna", "sreda",
      "stena", "taiga", "tuman", "tykva", "uzory",
      "valun", "vecher", "vetka", "vinta", "volna",
      "vysot", "zakat", "zerno", "zefir", "zoria"
    ],

    madeup: [
      "aevon", "alvyn", "arven", "avelo", "azuri",
      "belvo", "caeli", "calyx", "dovik", "elvar",
      "elvyn", "evori", "faelo", "feyra", "kaelo",
      "kelvo", "korvi", "laero", "levox", "liora",
      "loren", "luven", "maevo", "mevra", "naelo",
      "navir", "nelvo", "nexor", "nyvra", "orvyn",
      "ovelo", "raelo", "ravik", "revia", "rivon",
      "saeli", "selvo", "sovra", "taelo", "tavik",
      "ulvyn", "vaelo", "velto", "verix", "vexor",
      "viora", "virel", "xelvo", "xevra", "yavik",
      "yovra", "zaelo", "zayro", "zelvi", "zevra",
      "zoria", "zyven", "lunex", "sylvo", "novix",
      "orixa", "vaylo", "elora", "mirel", "nuvia"
    ]
  };

  const valid = name => /^[a-z]{5}$/.test(name);

  function shuffle(list) {
    const result = [...list];
    for (let i = result.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [result[i], result[j]] = [result[j], result[i]];
    }
    return result;
  }

  function pickNames() {
    const selected = document.getElementById("style").value;
    const pool = selected === "all"
      ? Object.values(words).flat()
      : words[selected];

    return shuffle([...new Set(pool.filter(valid))]).slice(0, 15);
  }

  document.getElementById("generate").onclick = () => {
    const results = document.getElementById("results");
    const status = document.getElementById("status");
    results.replaceChildren();

    const names = pickNames();

    if (!names.length) {
      status.textContent = "В этой категории пока нет вариантов.";
      return;
    }

    status.textContent =
      `Подобрано вариантов: ${names.length}. Доступность не проверена.`;

    for (const name of names) {
      const item = document.createElement("div");
      item.className = "item";

      const info = document.createElement("div");
      const label = document.createElement("div");
      label.className = "name";
      label.textContent = "@" + name;

      const note = document.createElement("div");
      note.className = "note";
      note.textContent = "5 букв · кандидат";

      info.append(label, note);

      const copy = document.createElement("button");
      copy.className = "copy";
      copy.textContent = "Копировать";

      copy.onclick = async () => {
        try {
          await navigator.clipboard.writeText(name);
          copy.textContent = "Скопировано!";
        } catch {
          window.prompt("Скопируй имя:", name);
        }
      };

      item.append(info, copy);
      results.append(item);
    }
  };
</script>
</body>
</html>
