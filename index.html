<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#08090d">
<title>StarCard Legends</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>
:root{
 --bg:#08090d;
 --surface:#101219;
 --surface2:#151821;
 --surface3:#1b1f29;
 --line:#262b36;
 --text:#f5f6f8;
 --muted:#858c99;
 --gold:#ffd45c;
 --blue:#6ca8ff;
 --purple:#a978ff;
 --red:#ff6377;
 --green:#68d49a;
}

*{
 box-sizing:border-box;
 -webkit-tap-highlight-color:transparent;
}

html,body{
 margin:0;
 padding:0;
 background:var(--bg);
 color:var(--text);
 font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
}

body{
 min-height:100vh;
}

button,input{
 font:inherit;
}

button{
 border:0;
 cursor:pointer;
}

button:active{
 transform:scale(.97);
}

#app{
 width:100%;
 max-width:520px;
 min-height:100vh;
 margin:auto;
 background:
 radial-gradient(circle at 50% -10%,#1d2434 0,transparent 35%),
 var(--bg);
 padding-bottom:92px;
}

.topbar{
 height:70px;
 padding:11px 15px;
 display:flex;
 align-items:center;
 justify-content:space-between;
 position:sticky;
 top:0;
 z-index:50;
 background:rgba(8,9,13,.86);
 backdrop-filter:blur(18px);
 border-bottom:1px solid rgba(255,255,255,.055);
}

.brand{
 display:flex;
 align-items:center;
 gap:10px;
}

.brandLogo{
 width:39px;
 height:39px;
 border-radius:12px;
 display:grid;
 place-items:center;
 background:linear-gradient(145deg,#242a36,#12151b);
 border:1px solid #343b48;
 font-size:19px;
 box-shadow:0 6px 20px #0007;
}

.brandName{
 font-weight:900;
 font-size:15px;
 letter-spacing:.5px;
}

.brandSeason{
 color:#69717e;
 font-size:8px;
 letter-spacing:1.7px;
 margin-top:2px;
}

.wallet{
 display:flex;
 align-items:center;
 gap:7px;
}

.walletItem{
 padding:8px 10px;
 background:#13161e;
 border:1px solid #292e38;
 border-radius:11px;
 font-size:12px;
 font-weight:850;
}

.walletItem.star{
 color:var(--gold);
}

main{
 padding:15px;
}

.pageTitle{
 font-size:28px;
 font-weight:900;
 letter-spacing:-.8px;
 margin:3px 0;
}

.pageSub{
 color:var(--muted);
 font-size:12px;
 margin-top:4px;
}

.hero{
 margin-top:17px;
 padding:18px;
 border-radius:20px;
 border:1px solid #2b313c;
 background:
 radial-gradient(circle at 85% 10%,#343b4a 0,transparent 30%),
 linear-gradient(145deg,#171b24,#0f1218);
 position:relative;
 overflow:hidden;
}

.hero:after{
 content:"";
 position:absolute;
 width:150px;
 height:150px;
 right:-65px;
 bottom:-80px;
 border-radius:50%;
 background:#ffffff08;
}

.heroTop{
 display:flex;
 justify-content:space-between;
 align-items:flex-start;
 position:relative;
 z-index:1;
}

.heroTitle{
 font-size:20px;
 font-weight:900;
}

.heroSmall{
 color:#818996;
 font-size:11px;
 margin-top:4px;
}

.level{
 padding:7px 9px;
 background:#0b0e13aa;
 border:1px solid #303641;
 border-radius:10px;
 font-size:10px;
 font-weight:800;
}

.progress{
 height:7px;
 background:#252a33;
 border-radius:20px;
 overflow:hidden;
 margin-top:15px;
}

.progress span{
 display:block;
 height:100%;
 border-radius:20px;
 background:linear-gradient(90deg,#758bff,#a978ff);
}

.balanceGrid{
 display:grid;
 grid-template-columns:1fr 1fr;
 gap:9px;
 margin-top:10px;
}

.balance{
 padding:13px;
 border-radius:15px;
 background:#11141b;
 border:1px solid #252a34;
}

.balanceLabel{
 color:#747c89;
 font-size:9px;
 text-transform:uppercase;
 letter-spacing:1px;
}

.balanceValue{
 font-size:19px;
 font-weight:900;
 margin-top:5px;
}

.energyBox{
 margin-top:10px;
 padding:12px 13px;
 background:#11141b;
 border:1px solid #252a34;
 border-radius:15px;
}

.energyHead{
 display:flex;
 justify-content:space-between;
 font-size:11px;
 color:#89919d;
}

.energyHead b{
 color:#fff;
}

.energyBar{
 height:7px;
 background:#242933;
 border-radius:20px;
 overflow:hidden;
 margin-top:8px;
}

.energyBar span{
 height:100%;
 display:block;
 background:linear-gradient(90deg,#67b7ff,#7c8cff);
 border-radius:20px;
}

.clickArea{
 display:flex;
 justify-content:center;
 padding:23px 0 21px;
}

.clicker{
 width:232px;
 height:232px;
 border-radius:50%;
 position:relative;
 color:#fff;
 background:
 radial-gradient(circle at 35% 25%,#424a59 0,#262d38 30%,#171b23 67%,#0f1217 100%);
 border:1px solid #454e5c;
 box-shadow:
 0 22px 65px #000b,
 inset 0 2px 12px #ffffff12,
 0 0 0 8px #ffffff03;
 display:flex;
 flex-direction:column;
 align-items:center;
 justify-content:center;
 overflow:hidden;
}

.clicker:before{
 content:"";
 position:absolute;
 width:140px;
 height:140px;
 border:1px solid #ffffff0d;
 border-radius:50%;
}

.clickerIcon{
 font-size:60px;
 line-height:1;
 filter:drop-shadow(0 6px 14px #000);
}

.clickerText{
 margin-top:9px;
 font-size:16px;
 font-weight:900;
}

.clickerHint{
 margin-top:4px;
 color:#7f8794;
 font-size:9px;
 letter-spacing:1.4px;
}

.tapFloat{
 position:absolute;
 color:#fff;
 font-weight:900;
 font-size:20px;
 pointer-events:none;
 animation:floatUp .75s ease forwards;
}

@keyframes floatUp{
 0%{opacity:1;transform:translateY(0) scale(1)}
 100%{opacity:0;transform:translateY(-65px) scale(1.2)}
}

.actionGrid{
 display:grid;
 grid-template-columns:1fr 1fr;
 gap:9px;
}

.action{
 min-height:54px;
 border-radius:14px;
 background:#141820;
 border:1px solid #282e39;
 color:#fff;
 display:flex;
 align-items:center;
 gap:10px;
 padding:10px 12px;
 text-align:left;
}

.actionIcon{
 font-size:21px;
}

.action b{
 display:block;
 font-size:12px;
}

.action span{
 display:block;
 color:#747d89;
 font-size:9px;
 margin-top:3px;
}

.sectionHead{
 display:flex;
 align-items:center;
 justify-content:space-between;
 margin:24px 1px 10px;
}

.sectionHead h2{
 font-size:17px;
 margin:0;
}

.link{
 color:#929aa7;
 font-size:11px;
}

.packGrid{
 display:grid;
 grid-template-columns:repeat(3,1fr);
 gap:8px;
}

.pack{
 min-height:185px;
 padding:8px;
 border-radius:17px;
 background:#11151c;
 border:1px solid #292f3a;
 transition:.2s;
}

.pack:active{
 transform:scale(.98);
}

.packVisual{
 height:91px;
 border-radius:12px;
 display:grid;
 place-items:center;
 font-size:42px;
 position:relative;
 overflow:hidden;
}

.packVisual.daily{
 background:linear-gradient(145deg,#222933,#151a21);
}

.packVisual.classic{
 background:linear-gradient(145deg,#202631,#12161d);
}

.packVisual.tiktok{
 background:linear-gradient(145deg,#25212b,#15131a);
}

.packTag{
 position:absolute;
 left:6px;
 top:6px;
 padding:4px 6px;
 border-radius:6px;
 background:#080a0dcc;
 font-size:7px;
 font-weight:900;
 color:#adb4be;
}

.packName{
 font-weight:900;
 font-size:12px;
 margin-top:9px;
}

.packDesc{
 color:#747d89;
 font-size:8px;
 line-height:1.35;
 min-height:22px;
 margin-top:3px;
}

.packPrice{
 margin-top:8px;
 width:100%;
 padding:8px 4px;
 border-radius:9px;
 background:#e9edf2;
 color:#08090d;
 font-size:9px;
 font-weight:900;
}

.packPrice.gold{
 background:#e2bd51;
}

.menu{
 display:flex;
 align-items:center;
 justify-content:space-between;
 gap:10px;
 padding:13px;
 border-radius:15px;
 background:#11151c;
 border:1px solid #252b35;
 margin-bottom:8px;
}

.menuLeft{
 display:flex;
 align-items:center;
 gap:11px;
 min-width:0;
}

.menuIcon{
 width:40px;
 height:40px;
 flex:none;
 display:grid;
 place-items:center;
 border-radius:11px;
 background:#1a1f28;
 font-size:19px;
}

.menuText{
 min-width:0;
}

.menuText b{
 display:block;
 font-size:12px;
}

.menuText span{
 display:block;
 color:#747d89;
 font-size:9px;
 margin-top:4px;
}

.btn{
 padding:10px 13px;
 border-radius:10px;
 background:#edf0f3;
 color:#08090d;
 font-size:10px;
 font-weight:900;
 white-space:nowrap;
}

.btn.dark{
 background:#171c24;
 color:#dfe2e7;
 border:1px solid #2b313b;
}

.btn.gold{
 background:#dfb943;
}

.btn.red{
 background:#cf4d61;
 color:#fff;
}

.cardsGrid{
 display:grid;
 grid-template-columns:repeat(2,1fr);
 gap:9px;
}

.card{
 padding:7px;
 background:#11151c;
 border:1px solid #282e39;
 border-radius:15px;
}

.cardArt{
 height:150px;
 border-radius:10px;
 display:grid;
 place-items:center;
 font-size:56px;
 background:linear-gradient(145deg,#252c38,#11151c);
}

.cardInfo{
 padding:2px 3px 4px;
}

.cardName{
 font-size:12px;
 font-weight:900;
 margin-top:8px;
}

.cardPower{
 color:#7b8490;
 font-size:9px;
 margin-top:4px;
}

.rarity{
 font-size:8px;
 font-weight:900;
 letter-spacing:1px;
 text-transform:uppercase;
 margin-top:5px;
}

.common{color:#a9b0ba}
.rare{color:#6aa9ff}
.epic{color:#ae7aff}
.legendary{color:#ffd45c}
.limited{color:#ff667b}

.tabs{
 display:flex;
 gap:7px;
 overflow:auto;
 padding-bottom:2px;
 margin:16px 0 12px;
 scrollbar-width:none;
}

.tabs::-webkit-scrollbar{display:none}

.tab{
 padding:9px 12px;
 border-radius:10px;
 background:#11151c;
 border:1px solid #272d37;
 color:#777f8c;
 font-size:10px;
 font-weight:800;
 white-space:nowrap;
}

.tab.active{
 color:#0a0b0e;
 background:#e9edf2;
}

.modal{
 position:fixed;
 inset:0;
 z-index:100;
 display:flex;
 align-items:flex-end;
 background:#000c;
}

.modal.hidden{
 display:none;
}

.modalBody{
 width:min(520px,100%);
 max-height:91vh;
 overflow:auto;
 padding:18px;
 background:#0e1117;
 border:1px solid #2b313c;
 border-bottom:0;
 border-radius:23px 23px 0 0;
 animation:modalUp .25s ease;
}

@keyframes modalUp{
 from{transform:translateY(30px);opacity:0}
 to{transform:translateY(0);opacity:1}
}

.modalTop{
 display:flex;
 justify-content:space-between;
 align-items:center;
 margin-bottom:13px;
}

.modalTop h2{
 margin:0;
 font-size:19px;
}

.close{
 width:32px;
 height:32px;
 border-radius:9px;
 background:#1b2029;
 color:#fff;
 font-size:18px;
}

.previewHero{
 text-align:center;
 padding:7px 0 14px;
}

.previewIcon{
 font-size:64px;
}

.previewHero h2{
 margin:5px 0;
}

.previewHero p{
 color:#7d8692;
 font-size:10px;
}

.previewGrid{
 display:grid;
 grid-template-columns:repeat(3,1fr);
 gap:7px;
}

.previewCard{
 padding:7px;
 border-radius:12px;
 background:#141921;
 border:1px solid #292f39;
 text-align:center;
}

.previewCard .emoji{
 height:58px;
 display:grid;
 place-items:center;
 font-size:30px;
}

.previewCard b{
 display:block;
 font-size:9px;
}

.previewCard small{
 display:block;
 color:#747d89;
 font-size:7px;
 margin-top:3px;
}

.openButton{
 width:100%;
 padding:14px;
 border-radius:12px;
 background:#e9edf2;
 color:#08090d;
 font-weight:900;
 margin-top:14px;
}

.opening{
 text-align:center;
 padding:20px 0;
}

.openingPack{
 width:145px;
 height:145px;
 margin:14px auto 20px;
 border-radius:24px;
 display:grid;
 place-items:center;
 font-size:67px;
 background:linear-gradient(145deg,#272e3a,#11151b);
 border:1px solid #424a57;
 box-shadow:0 25px 60px #000b;
}

.openingPack.animate{
 animation:packShake 1.15s ease forwards;
}

@keyframes packShake{
 0%{transform:scale(1) rotate(0)}
 15%{transform:scale(1.05) rotate(-5deg)}
 30%{transform:scale(1.08) rotate(5deg)}
 45%{transform:scale(1.05) rotate(-4deg)}
 60%{transform:scale(1.12) rotate(4deg)}
 78%{transform:scale(1.3);opacity:.7}
 100%{transform:scale(.8);opacity:0}
}

.revealGrid{
 display:grid;
 grid-template-columns:repeat(2,1fr);
 gap:8px;
 margin-top:12px;
}

.revealCard{
 opacity:0;
 transform:translateY(25px) scale(.8);
 animation:reveal .45s ease forwards;
}

@keyframes reveal{
 to{
  opacity:1;
  transform:translateY(0) scale(1);
 }
}

.stats{
 display:grid;
 grid-template-columns:repeat(3,1fr);
 gap:8px;
}

.stat{
 padding:12px;
 border-radius:14px;
 background:#11151c;
 border:1px solid #252b35;
}

.stat small{
 color:#707986;
 font-size:8px;
}

.stat b{
 display:block;
 font-size:17px;
 margin-top:5px;
}

.task{
 display:flex;
 align-items:center;
 gap:10px;
 padding:11px;
 background:#11151c;
 border:1px solid #252b35;
 border-radius:14px;
 margin-bottom:8px;
}

.taskIcon{
 width:40px;
 height:40px;
 flex:none;
 display:grid;
 place-items:center;
 border-radius:11px;
 background:#1a2029;
 font-size:19px;
}

.taskInfo{
 flex:1;
 min-width:0;
}

.taskInfo b{
 display:block;
 font-size:11px;
}

.taskInfo small{
 display:block;
 color:#737c89;
 font-size:8px;
 margin-top:4px;
}

.passIntro{
 padding:15px;
 border-radius:17px;
 background:linear-gradient(145deg,#191b22,#11141a);
 border:1px solid #302e29;
 margin-top:14px;
}

.passIntroTop{
 display:flex;
 align-items:center;
 justify-content:space-between;
}

.passIntro h2{
 margin:0;
 font-size:17px;
}

.premiumStatus{
 color:var(--gold);
 font-size:9px;
 font-weight:900;
}

.passXP{
 margin-top:12px;
}

.passXPTop{
 display:flex;
 justify-content:space-between;
 color:#858d99;
 font-size:9px;
 margin-bottom:6px;
}

.passXPBar{
 height:7px;
 background:#272a31;
 border-radius:20px;
 overflow:hidden;
}

.passXPBar span{
 display:block;
 height:100%;
 width:72%;
 background:linear-gradient(90deg,#d8a936,#ffe18a);
}

.passColumns{
 display:grid;
 grid-template-columns:1fr 1fr;
 gap:8px;
 margin-top:14px;
}

.passLane{
 min-width:0;
}

.laneTitle{
 padding:10px;
 text-align:center;
 border-radius:11px;
 margin-bottom:8px;
 font-size:10px;
 font-weight:900;
 letter-spacing:1px;
}

.freeLane .laneTitle{
 background:#181d24;
 color:#a6adb7;
 border:1px solid #292f38;
}

.premiumLane .laneTitle{
 background:#292317;
 color:#ffd45c;
 border:1px solid #54431d;
}

.passReward{
 min-height:105px;
 padding:9px 7px;
 margin-bottom:7px;
 border-radius:12px;
 background:#11151c;
 border:1px solid #272d37;
 text-align:center;
 position:relative;
}

.premiumLane .passReward{
 background:linear-gradient(145deg,#17150f,#12130f);
 border-color:#40361e;
}

.passLevel{
 position:absolute;
 top:6px;
 left:7px;
 color:#69717c;
 font-size:7px;
}

.passEmoji{
 font-size:28px;
 margin-top:5px;
}

.passReward b{
 display:block;
 font-size:9px;
 margin-top:4px;
}

.passReward small{
 display:block;
 color:#747d88;
 font-size:7px;
 margin-top:3px;
}

.claim{
 margin-top:7px;
 padding:5px 8px;
 border-radius:7px;
 background:#e9edf2;
 color:#090a0d;
 font-size:8px;
 font-weight:900;
}

.premiumLane .claim{
 background:#dcb747;
}

.lock{
 display:block;
 margin-top:7px;
 color:#535b66;
 font-size:9px;
}

.claimed{
 display:block;
 margin-top:7px;
 color:#68d49a;
 font-weight:900;
 font-size:10px;
}

.profileHero{
 text-align:center;
 padding:18px;
 background:#11151c;
 border:1px solid #292f39;
 border-radius:19px;
 margin-top:15px;
}

.avatar{
 width:65px;
 height:65px;
 margin:auto;
 border-radius:50%;
 display:grid;
 place-items:center;
 background:linear-gradient(145deg,#303746,#151922);
 border:1px solid #414958;
 font-size:27px;
}

.username{
 font-weight:900;
 margin-top:9px;
}

.title{
 color:#7d8692;
 font-size:10px;
 margin-top:4px;
}

.adminBox{
 border-color:#62343e;
 background:#181115;
}

.adminLabel{
 color:#ff7383;
}

.input{
 width:100%;
 background:#090c11;
 color:#fff;
 border:1px solid #292f39;
 border-radius:11px;
 padding:12px;
 outline:none;
 margin:6px 0;
}

.toast{
 position:fixed;
 z-index:300;
 left:50%;
 bottom:94px;
 transform:translateX(-50%);
 background:#edf0f3;
 color:#090a0d;
 padding:10px 14px;
 border-radius:10px;
 font-size:11px;
 font-weight:900;
 box-shadow:0 10px 35px #000b;
 white-space:nowrap;
 animation:toastIn .2s ease;
}

@keyframes toastIn{
 from{opacity:0;transform:translate(-50%,10px)}
 to{opacity:1;transform:translate(-50%,0)}
}

.bottomNav{
 position:fixed;
 z-index:60;
 bottom:0;
 left:50%;
 transform:translateX(-50%);
 width:min(520px,100%);
 height:79px;
 display:grid;
 grid-template-columns:repeat(5,1fr);
 background:rgba(12,15,20,.96);
 border-top:1px solid #222832;
 backdrop-filter:blur(18px);
}

.navBtn{
 background:none;
 color:#646d79;
 display:flex;
 flex-direction:column;
 align-items:center;
 justify-content:center;
 gap:4px;
 font-size:19px;
}

.navBtn span{
 font-size:8px;
 font-weight:800;
}

.navBtn.active{
 color:#f4f5f7;
}

.empty{
 text-align:center;
 padding:35px 15px;
 color:#707986;
 background:#11151c;
 border:1px solid #252b35;
 border-radius:15px;
}

@media(max-width:380px){
 .packGrid{grid-template-columns:1fr}
 .pack{min-height:150px}
 .packVisual{height:70px}
 .clicker{width:205px;height:205px}
 .walletItem{padding:7px 8px}
}
</style>
</head>

<body>

<div id="app">

<header class="topbar">

 <div class="brand">
  <div class="brandLogo">★</div>

  <div>
   <div class="brandName">STARCARD</div>
   <div class="brandSeason">LEGENDS · SEASON 01</div>
  </div>
 </div>

 <div class="wallet">
  <div class="walletItem">🪙 <span id="headCoins">12 500</span></div>
  <div class="walletItem star">⭐ <span id="headStars">1 250</span></div>
 </div>

</header>

<main id="screen"></main>

<nav class="bottomNav">

 <button class="navBtn" data-page="home" onclick="openPage('home')">
  ⌂
  <span>Главная</span>
 </button>

 <button class="navBtn" data-page="cards" onclick="openPage('cards')">
  ▣
  <span>Карты</span>
 </button>

 <button class="navBtn" data-page="battle" onclick="openPage('battle')">
  ⚔
  <span>Батлы</span>
 </button>

 <button class="navBtn" data-page="market" onclick="openPage('market')">
  ◇
  <span>Рынок</span>
 </button>

 <button class="navBtn" data-page="profile" onclick="openPage('profile')">
  ●
  <span>Профиль</span>
 </button>

</nav>

</div>

<div id="modal" class="modal hidden"></div>

<script>

const ADMIN_USERNAME="florrasoo";

const cardsDB=[
 {n:"Pixel Knight",r:"Обычная",p:10,e:"🛡️"},
 {n:"Moon Cat",r:"Обычная",p:10,e:"🐈"},
 {n:"Street Bot",r:"Обычная",p:10,e:"🤖"},

function getPackPreview(type){

 const legendary=cardsDB.filter(x=>x.r==="Легендарная");
 const limited=cardsDB.filter(x=>x.r==="Лимитированная");

 if(type==="daily"){
  return[
   ...common.slice(0,9),
   ...rare.slice(0,1)
  ];
 }

 if(type==="classic"){
  return[
   ...common.slice(0,4),
   ...rare.slice(0,3),
   ...epic.slice(0,2),
   ...legendary.slice(0,1)
  ];
 }

 return[
  ...common.slice(0,4),
  ...rare.slice(0,3),
  ...epic.slice(0,2),
  ...legendary.slice(0,1),
  ...limited.slice(0,1)
 ];
}

function taskHTML(t){

 const done=state.completed.includes(t[3]);

 return `
 <div class="task">

  <div class="taskIcon">${t[0]}</div>

  <div class="taskInfo">
   <b>${t[1]}</b>
   <small>${t[2]}</small>
  </div>

  <button class="btn ${done?"dark":""}"
   onclick="completeTask(${t[3]})">
   ${done?"✓":"Забрать"}
  </button>

 </div>
 `;
}

function achievement(icon,title,reward){

 return `
 <div class="task">

  <div class="taskIcon">${icon}</div>

  <div class="taskInfo">
   <b>${title}</b>
   <small>${reward}</small>
  </div>

  <span class="lock">🔒</span>

 </div>
 `;
}

function completeTask(id){

 if(state.completed.includes(id)){
  toast("Награда уже получена");
  return;
 }

 const rewards={
  1:{coins:1000,stars:0},
  2:{coins:0,stars:50},
  3:{coins:300,stars:0},
  4:{coins:200,stars:0},
  5:{coins:0,stars:100}
 };

 state.coins+=rewards[id].coins;
 state.stars+=rewards[id].stars;

 state.completed.push(id);

 save();

 toast("🎉 Награда получена");

 tasks();
}

function passReward(reward,level,type){

 const claimed=
  type==="free"
  ?state.claimedFreePass.includes(level)
  :state.claimedPremiumPass.includes(level);

 const unlocked=state.battlePass>=level;

 const canClaim=
  unlocked &&
  !claimed &&
  (type==="free"||state.premiumPass);

 return `
 <div class="passReward">

  <div class="passLevel">
   ${level}
  </div>

  <div class="passEmoji">
   ${reward[0]}
  </div>

  <b>${reward[1]}</b>
  <small>${reward[2]}</small>

  ${
   claimed
   ?`<span class="claimed">✓ Получено</span>`
   :canClaim
   ?`<button class="claim"
      onclick="claimPassReward(${level},'${type}')">
      Забрать
     </button>`
   :`<span class="lock">🔒</span>`
  }

 </div>
 `;
}

function claimPassReward(level,type){

 const list=
  type==="free"
  ?state.claimedFreePass
  :state.claimedPremiumPass;

 if(list.includes(level)){
  toast("Уже получено");
  return;
 }

 if(state.battlePass<level){
  toast("Уровень ещё не открыт");
  return;
 }

 if(type==="premium"&&!state.premiumPass){
  toast("Сначала купи Premium Pass");
  return;
 }

 const rewardsFree=[
  {coins:0,stars:0},
  {coins:1000,stars:0},
  {coins:0,stars:0},
  {coins:0,stars:0},
  {coins:2500,stars:0},
  {coins:0,stars:0},
  {coins:5000,stars:0},
  {coins:0,stars:0},
  {coins:0,stars:25},
  {coins:0,stars:0}
 ];

 const rewardsPremium=[
  {coins:0,stars:100},
  {coins:0,stars:0},
  {coins:10000,stars:0},
  {coins:0,stars:0},
  {coins:0,stars:150},
  {coins:0,stars:0},
  {coins:25000,stars:0},
  {coins:0,stars:250},
  {coins:0,stars:0},
  {coins:0,stars:0}
 ];

 const reward=
  type==="premium"
  ?rewardsPremium[level-1]
  :rewardsFree[level-1];

 if(reward){

  state.coins+=reward.coins;
  state.stars+=reward.stars;

 }

 list.push(level);

 save();

 toast("🎉 Награда получена");

 battlePass();
}

function buyPass(){

 if(state.premiumPass){
  toast("Premium Pass уже куплен");
  return;
 }

 if(state.stars<500){
  toast("Недостаточно Stars");
  return;
 }

 state.stars-=500;
 state.premiumPass=true;

 save();

 toast("★ Premium Pass активирован");

 battlePass();
}

   Активировать

 `);
}

function activatePromo(){

 const code=document.getElementById("promoInput").value
  .trim()
  .toUpperCase();

 const rewards={
  STAR100:100,
  WELCOME:250,
  TIKTOK:150
 };

 if(state.promoUsed.includes(code)){
  toast("Код уже использован");
  return;
 }

 if(!rewards[code]){
  toast("Промокод не найден");
  return;
 }

 state.stars+=rewards[code];
 state.promoUsed.push(code);

 save();
 closeModal();

 toast("+"+rewards[code]+" Stars");
}

function requestWithdraw(){

 const amount=parseInt(
  document.getElementById("withdrawAmount").value
 );

 if(!amount||amount<1000||amount>state.stars){
  toast("Некорректная сумма");
  return;
 }

 state.stars-=amount;

 save();
 closeModal();

 toast("Заявка создана · DEMO");
}

function adminAddStars(){

 if(!isAdmin())return;

 const n=parseInt(
  document.getElementById("adminStars").value
 )||0;

 state.stars+=n;

 save();

 toast("Stars начислены");
 admin();
}

function adminRemoveStars(){

 if(!isAdmin())return;

 const n=parseInt(
  document.getElementById("adminStars").value
 )||0;

 state.stars=Math.max(0,state.stars-n);

 save();

 toast("Stars списаны");
 admin();
}

function resetDemo(){

 if(!isAdmin())return;

 localStorage.removeItem("scl_demo");
 location.reload();
}

function showModal(content){

function closeModal(){
 modal.classList.add("hidden");
 modal.innerHTML="";
}
