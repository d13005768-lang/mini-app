<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Username Finder</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 20px;
      background: var(--tg-theme-bg-color, #10131b);
      color: var(--tg-theme-text-color, #fff);
      font: 16px Arial, sans-serif;
    }

    main { max-width: 480px; margin: 0 auto; }
    h1 { font-size: 26px; }

    select, button {
      width: 100%;
      padding: 14px;
      margin: 8px 0;
      border: 0;
      border-radius: 12px;
      font-size: 16px;
    }

    select {
      background: var(--tg-theme-secondary-bg-color, #202637);
      color: var(--tg-theme-text-color, white);
    }

    button {
      background: var(--tg-theme-button-color, #5288ff);
      color: var(--tg-theme-button-text-color, white);
      cursor: pointer;
    }

    .item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 12px;
      margin-top: 9px;
      border-radius: 12px;
      background: var(--tg-theme-secondary-bg-color, #202637);
    }

    .name { font-size: 20px; font-weight: bold; }
    .note { font-size: 12px; color: var(--tg-theme-hint-color, #aab2c5); }
    .copy { width: auto; margin: 0; padding: 10px 13px; }
  </style>
</head>
<body>
<main>
  <h1>✨ Username Finder</h1>
  <p>Красивые Telegram-имена из пяти латинских букв.</p>

  <select id="style">
    <option value="all">Все стили</option>
    <option value="english">Английские слова</option>
    <option value="russian">Русские слова латиницей</option>
    <option value="madeup">Красивые выдуманные</option>
  </select>

  <button id="generate">Подобрать имена</button>
  <p id="status" class="note"></p>
  <section id="results"></section>
</main>

<script>
  const tg = window.Telegram?.WebApp;
  tg?.ready();
  tg?.expand();

  const words = {
    english: [
      "raven", "flame", "dream", "stone", "light",
      "storm", "heart", "night", "cloud", "bliss",
      "shine", "brave", "grace", "charm", "quest",
      "bloom", "frost", "peace", "ocean", "ghost"
    ],
    russian: [
      "privet", "dusha", "noch", "mir", "zvezda",
      "solnce", "mechta", "volna", "iskra", "nebo",
      "luna", "veter", "vesna", "radost", "tisha"
    ],
    madeup: [
      "velor", "lunet", "zefir", "elvyn", "avero",
      "nuvia", "sorel", "vaylo", "lyora", "mirel",
      "orvyn", "zelvo", "nairi", "evora", "lurex",
      "rovik", "alven", "sylva", "novar", "elora"
    ]
  };

  // Оставляем только имена ровно из пяти латинских букв.
  const valid = name => /^[a-z]{5}$/.test(name);

  function pickNames() {
    const selected = document.getElementById("style").value;
    const pool = selected === "all"
      ? Object.values(words).flat()
      : words[selected];

    return [...new Set(pool.filter(valid))]
      .sort(() => Math.random() - 0.5)
      .slice(0, 12);
  }

  document.getElementById("generate").onclick = () => {
    const results = document.getElementById("results");
    const status = document.getElementById("status");
    results.replaceChildren();

    const names = pickNames();

    status.textContent =
      "Подборка готова. Доступность Telegram не проверена.";

    for (const name of names) {
      const item = document.createElement("div");
      item.className = "item";

      const info = document.createElement("div");
      const label = document.createElement("div");
      label.className = "name";
      label.textContent = "@" + name;

      const note = document.createElement("div");
      note.className = "note";
      note.textContent = "Кандидат · 5 букв";

      info.append(label, note);

      const button = document.createElement("button");
      button.className = "copy";
      button.textContent = "Копировать";

      button.onclick = async () => {
        try {
          await navigator.clipboard.writeText(name);
          button.textContent = "Скопировано!";
        } catch {
          button.textContent = name;
        }
      };

      item.append(info, button);
      results.append(item);
    }
  };
</script>
</body>
</html>
