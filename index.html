<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#090b10">
<title>StarCard Legends</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{
 margin:0;
 background:#080a0e;
 color:#f4f5f7;
 font-family:Inter,Arial,sans-serif;
}
button,input{font:inherit}
button{cursor:pointer}
button:active{transform:scale(.97)}

#app{
 width:100%;
 max-width:520px;
 min-height:100vh;
 margin:auto;
 background:#0b0e14;
 padding-bottom:85px;
}

header{
 height:68px;
 padding:12px 15px;
 display:flex;
 align-items:center;
 justify-content:space-between;
 border-bottom:1px solid #202630;
 position:sticky;
 top:0;
 z-index:50;
 background:#0b0e14ee;
 backdrop-filter:blur(15px);
}

.logo{
 font-size:18px;
 font-weight:900;
 letter-spacing:1px;
}
.logo small{
 display:block;
 color:#707987;
 font-size:9px;
 letter-spacing:2px;
 margin-top:2px;
}

.starBalance{
 background:#151a22;
 border:1px solid #29313c;
 color:#fff;
 padding:9px 12px;
 border-radius:12px;
 font-weight:800;
}

main{padding:16px}

h1{font-size:27px;margin:5px 0}
h2{font-size:18px;margin:0}
h3{margin:7px 0;font-size:15px}
p{margin:5px 0}
.muted{color:#7c8592;font-size:13px}

.row{
 display:flex;
 gap:9px;
}
.row>*{flex:1}

.box{
 background:#121720;
 border:1px solid #252d38;
 border-radius:15px;
 padding:14px;
}

.balances{
 display:grid;
 grid-template-columns:1fr 1fr;
 gap:9px;
 margin:16px 0;
}

.balanceTitle{
 color:#818b98;
 font-size:11px;
 text-transform:uppercase;
}
.balanceValue{
 font-size:19px;
 font-weight:900;
 margin-top:4px;
}

.energy{
 margin:12px 0;
}
.energyHead{
 display:flex;
 justify-content:space-between;
 font-size:13px;
 margin-bottom:7px;
}
.bar{
 height:8px;
 background:#1b212b;
 border-radius:20px;
 overflow:hidden;
}
.bar span{
 display:block;
 height:100%;
 background:#7e8cff;
 border-radius:20px;
 transition:.2s;
}

.clickWrap{
 display:flex;
 justify-content:center;
 padding:17px 0 23px;
}

.clicker{
 width:220px;
 height:220px;
 border-radius:50%;
 border:1px solid #414b59;
 background:
 radial-gradient(circle at 35% 25%,#303949,#1b212b 45%,#11151c 72%);
 box-shadow:
 0 25px 60px #0009,
 inset 0 0 35px #fff06;
 display:flex;
 flex-direction:column;
 align-items:center;
 justify-content:center;
 color:white;
 user-select:none;
}
.clicker .big{font-size:58px}
.clicker strong{font-size:21px;margin-top:5px}
.clicker small{color:#858f9d;margin-top:5px}

.btn{
 border:0;
 border-radius:11px;
 padding:11px 13px;
 background:#edf0f4;
 color:#080a0e;
 font-weight:850;
}
.btn.dark{
 background:#151a22;
 color:#f3f4f6;
 border:1px solid #29313c;
}
.btn.red{
 background:#cf4658;
 color:white;
}

.section{
 display:flex;
 justify-content:space-between;
 align-items:center;
 margin:21px 0 10px;
}

.grid{
 display:grid;
 grid-template-columns:repeat(2,1fr);
 gap:9px;
}

.pack{
 min-height:175px;
 padding:10px;
 background:#121720;
 border:1px solid #252d38;
 border-radius:15px;
 display:flex;
 flex-direction:column;
 justify-content:space-between;
}
.packArt{
 height:80px;
 border-radius:11px;
 background:#181e27;
 display:grid;
 place-items:center;
 font-size:39px;
}
.packTitle{font-weight:850;margin-top:9px}
.packDesc{color:#7e8793;font-size:11px;margin:3px 0 8px}

.card{
 background:#121720;
 border:1px solid #252d38;
 border-radius:14px;
 padding:8px;
 overflow:hidden;
}
.cardArt{
 height:125px;
 border-radius:9px;
 background:linear-gradient(135deg,#202735,#10141b);
 display:grid;
 place-items:center;
 font-size:48px;
}
.cardName{
 font-size:13px;
 font-weight:850;
 margin-top:8px;
}
.cardMeta{
 font-size:10px;
 color:#737d8a;
 margin-top:4px;
}
.rarity{
 font-size:9px;
 text-transform:uppercase;
 font-weight:900;
 margin-top:5px;
 letter-spacing:.8px;
}
.common{color:#a9b0b8}
.rare{color:#65a5ff}
.epic{color:#b77cff}
.legendary{color:#ffc957}
.limited{color:#ff6577}

.menu{
 background:#121720;
 border:1px solid #252d38;
 border-radius:14px;
 padding:14px;
 margin-bottom:9px;
 display:flex;
 align-items:center;
 justify-content:space-between;
}
.menuInfo b{display:block;font-size:14px}
.menuInfo span{
 display:block;
 color:#7b8490;
 font-size:11px;
 margin-top:4px;
}

.task{
 display:flex;
 align-items:center;
 gap:11px;
 padding:12px;
 margin-bottom:8px;
 background:#121720;
 border:1px solid #252d38;
 border-radius:14px;
}
.taskIcon{
 width:42px;
 height:42px;
 flex:none;
 border-radius:11px;
 background:#1b222c;
 display:grid;
 place-items:center;
 font-size:20px;
}
.taskInfo{flex:1}
.taskInfo b{font-size:13px}
.taskInfo small{
 display:block;
 color:#7c8591;
 font-size:11px;
 margin-top:4px;
}

.tabs{
 display:flex;
 gap:7px;
 overflow:auto;
 margin:14px 0;
}
.tab{
 white-space:nowrap;
 background:#121720;
 border:1px solid #252d38;
 color:#7f8995;
 border-radius:10px;
 padding:9px 12px;
}
.tab.active{
 background:#edf0f4;
 color:#080a0e;
}

.modal{
 position:fixed;
 inset:0;
 z-index:100;
 background:#000b;
 display:flex;
 align-items:flex-end;
 justify-content:center;
}
.modal.hidden{display:none}
.modalContent{
 width:min(520px,100%);
 max-height:88vh;
 overflow:auto;
 background:#10141b;
 border:1px solid #2a323e;
 border-radius:20px 20px 0 0;
 padding:18px;
}
.close{
 float:right;
 background:#1b212a;
 color:white;
 border:0;
 border-radius:9px;
 padding:6px 10px;
}
.input{
 width:100%;
 padding:12px;
 margin:8px 0;
 border-radius:10px;
 border:1px solid #29313c;
 background:#090c11;
 color:white;
 outline:none;
}

.stats{
 display:grid;
 grid-template-columns:repeat(3,1fr);
 gap:7px;
 margin:14px 0;
}
.stat{
 background:#121720;
 border:1px solid #252d38;
 border-radius:13px;
 padding:12px;
}
.stat small{color:#737d89;font-size:9px}
.stat b{display:block;font-size:17px;margin-top:5px}

.pass{
 background:#121720;
 border:1px solid #252d38;
 border-radius:15px;
 padding:15px;
}
.passHead{
 display:flex;
 justify-content:space-between;
 margin-bottom:8px;
}

.admin{
 border-color:#713f48;
 background:#171116;
}
.adminTitle{color:#ff7180}

.toast{
 position:fixed;
 z-index:200;
 left:50%;
 bottom:95px;
 transform:translateX(-50%);
 background:#eef1f5;
 color:#090b0e;
 border-radius:11px;
 padding:10px 14px;
 font-weight:800;
 white-space:nowrap;
 box-shadow:0 10px 30px #0009;
}

nav{
 position:fixed;
 left:50%;
 bottom:0;
 transform:translateX(-50%);
 width:min(520px,100%);
 height:76px;
 z-index:60;
 display:grid;
 grid-template-columns:repeat(5,1fr);
 background:#0d1118f7;
 border-top:1px solid #202630;
 backdrop-filter:blur(15px);
}
nav button{
 border:0;
 background:none;
 color:#707986;
 font-size:20px;
}
nav button.active{color:white}
nav small{
 display:block;
 font-size:9px;
 margin-top:4px;
}

@media(max-width:360px){
 .clicker{width:190px;height:190px}
 .grid{gap:7px}
 main{padding:12px}
}
</style>
</head>

<body>

<div id="app">

<header>
 <div class="logo">
  STARCARD
  <small>LEGENDS · SEASON 01</small>
 </div>

 <button class="starBalance" onclick="openPage('profile')">
  ⭐ <span id="topStars">1250</span>
 </button>
</header>

<main id="screen"></main>

<nav>
 <button onclick="openPage('home')" id="nav-home">⌂<small>Главная</small></button>
 <button onclick="openPage('cards')" id="nav-cards">▣<small>Карты</small></button>
 <button onclick="openPage('battle')" id="nav-battle">⚔<small>Батлы</small></button>
 <button onclick="openPage('market')" id="nav-market">◇<small>Рынок</small></button>
 <button onclick="openPage('profile')" id="nav-profile">●<small>Профиль</small></button>
</nav>

</div>

<div id="modal" class="modal hidden"></div>

<script>

const ADMIN_USERNAME="florrasoo";

const cardsDB=[
 {n:"Pixel Knight",r:"Обычная",p:10,e:"🛡️"},
 {n:"Moon Cat",r:"Обычная",p:10,e:"🐈"},
 {n:"Street Bot",r:"Обычная",p:10,e:"🤖"},
 {n:"Meme Dog",r:"Обычная",p:10,e:"🐕"},
 {n:"Neon Kid",r:"Обычная",p:10,e:"🧑‍🚀"},
 {n:"Cloud Fox",r:"Обычная",p:10,e:"🦊"},
 {n:"Retro Duck",r:"Обычная",p:10,e:"🦆"},
 {n:"Space Rat",r:"Обычная",p:10,e:"🐀"},
 {n:"Tiny Dragon",r:"Обычная",p:10,e:"🐉"},
 {n:"Cyber Wolf",r:"Редкая",p:30,e:"🐺"},
 {n:"Star Samurai",r:"Эпическая",p:60,e:"🥷"},
 {n:"Void King",r:"Эпическая",p:60,e:"👑"},
 {n:"Golden Legend",r:"Легендарная",p:100,e:"🌟"},
 {n:"TikTok Icon",r:"Лимитированная",p:150,e:"🎵"}
];

let state=JSON.parse(localStorage.getItem("starcard_legends"))||{
 username:"florrasoo",
 coins:12500,
 stars:1250,
 energy:100,
 maxEnergy:100,
 tap:1,
 level:1,
 cards:[],
 referrals:0,
 referralStars:0,
 wins:7,
 battles:12,
 clan:"Star Hunters",
 battlePass:18,
 completed:[],
 dailyOpened:false,
 promoUsed:[]
};

function save(){
 localStorage.setItem("starcard_legends",JSON.stringify(state));
}

function tgUser(){
 try{
  return window.Telegram.WebApp.initDataUnsafe.user?.username || state.username;
 }catch(e){
  return state.username;
 }
}

function isAdmin(){
 return String(tgUser()).toLowerCase()===ADMIN_USERNAME;
}

function fmt(n){
 return Math.floor(n).toLocaleString("ru-RU");
}

function rarityClass(r){
 if(r==="Обычная")return"common";
 if(r==="Редкая")return"rare";
 if(r==="Эпическая")return"epic";
 if(r==="Легендарная")return"legendary";
 return"limited";
}

function toast(text){
 const el=document.createElement("div");
 el.className="toast";
 el.textContent=text;
 document.body.appendChild(el);
 setTimeout(()=>el.remove(),1700);
}

function openPage(name){
 if(name==="home")home();
 if(name==="cards")cards();
 if(name==="battle")battle();
 if(name==="market")market();
 if(name==="profile")profile();
 if(name==="tasks")tasks();
 if(name==="referrals")referrals();
 if(name==="pass")battlePass();
 if(name==="clans")clans();
 if(name==="tournaments")tournaments();
 if(name==="admin")admin();

 document.querySelectorAll("nav button").forEach(x=>x.classList.remove("active"));
 const n=document.getElementById("nav-"+name);
 if(n)n.classList.add("active");

 window.scrollTo(0,0);
}

function home(){

 screen.innerHTML=`

 <h1>Привет, @${tgUser()} 👋</h1>
 <div class="muted">Твой игровой центр</div>

 <div class="balances">
  <div class="box">
   <div class="balanceTitle">Coins</div>
   <div class="balanceValue">🪙 ${fmt(state.coins)}</div>
  </div>

  <div class="box">
   <div class="balanceTitle">Stars</div>
   <div class="balanceValue">⭐ ${fmt(state.stars)}</div>
  </div>
 </div>

 <div class="energy">
  <div class="energyHead">
   <span>⚡ Энергия</span>
   <b>${state.energy}/${state.maxEnergy}</b>
  </div>

  <div class="bar">
   <span style="width:${state.energy/state.maxEnergy*100}%"></span>
  </div>
 </div>

 <div class="clickWrap">
  <button class="clicker" onclick="tap()">
   <div class="big">★</div>
   <strong>+${state.tap} COIN</strong>
   <small>НАЖМИ</small>
  </button>
 </div>

 <div class="row">
  <button class="btn dark" onclick="upgrade()">⚡ Улучшить<br>${fmt(500*state.level)} 🪙</button>
  <button class="btn dark" onclick="boost()">×2<br>50 ⭐</button>
 </div>

 <div class="section">
  <h2>Паки</h2>
  <button class="btn dark" onclick="openPage('cards')">Коллекция</button>
 </div>

 <div class="grid">
  ${pack("🎁","Daily Pack","10 карт · 9 обычных + 1 редкая","Бесплатно","daily")}
  ${pack("📦","Classic Pack","10 карт · 4 / 3 / 2 / 1","100 ⭐","classic")}
  ${pack("🎵","TikTok Pack","11 карт · 4 / 3 / 2 / 1 / 1","150 ⭐","tiktok")}
 </div>

 <div class="section">
  <h2>Быстрые действия</h2>
 </div>

 <div class="menu" onclick="openPage('tasks')">
  <div class="menuInfo"><b>🎯 Задания</b><span>Ежедневные, недельные и достижения</span></div>
  <button class="btn dark">›</button>
 </div>

 <div class="menu" onclick="openPage('referrals')">
  <div class="menuInfo"><b>👥 Рефералы</b><span>${state.referrals} приглашённых</span></div>
  <button class="btn dark">›</button>
 </div>

 <div class="menu" onclick="openPage('pass')">
  <div class="menuInfo"><b>🎫 Боевой пропуск</b><span>Сезон 01 · уровень ${state.battlePass}</span></div>
  <button class="btn dark">›</button>
 </div>
 `;
}

function pack(icon,name,desc,price,type){

 return `
 <div class="pack">
  <div class="packArt">${icon}</div>

  <div>
   <div class="packTitle">${name}</div>
   <div class="packDesc">${desc}</div>
  </div>

  <button class="btn" onclick="event.stopPropagation();openPack('${type}')">
   ${price}
  </button>
 </div>
 `;
}

function tap(){

 if(state.energy<=0){
  toast("⚡ Энергия закончилась");
  return;
 }

 state.coins+=state.tap;
 state.energy--;

 save();
 home();
}

function upgrade(){

 const price=500*state.level;

 if(state.coins<price){
  toast("Недостаточно Coins");
  return;
 }

 state.coins-=price;
 state.level++;
 state.tap++;

 save();

 toast("Доход за тап увеличен");
 home();
}

function boost(){

 if(state.stars<50){
  toast("Недостаточно Stars");
  return;
 }

 state.stars-=50;
 state.tap*=2;

 save();

 toast("Буст ×2 активирован");
 home();
}

function choose(arr,n){
 let result=[];

 for(let i=0;i<n;i++){
  result.push(arr[Math.floor(Math.random()*arr.length)]);
 }

 return result;
}

function openPack(type){

 if(type==="daily"&&state.dailyOpened){
  toast("Daily Pack уже открыт сегодня");
  return;
 }

 const cost=type==="classic"?100:type==="tiktok"?150:0;

 if(cost&&state.stars<cost){
  toast("Недостаточно Stars");
  return;
 }

 if(cost)state.stars-=cost;

 let result=[];

 if(type==="daily"){

  const common=cardsDB.filter(x=>x.r==="Обычная");
  const rare=cardsDB.filter(x=>x.r==="Редкая");

  result=[
   ...choose(common,9),
   ...choose(rare,1)
  ];

  state.dailyOpened=true;
 }

 if(type==="classic"){

  result=[
   ...choose(cardsDB.filter(x=>x.r==="Обычная"),4),
   ...choose(cardsDB.filter(x=>x.r==="Редкая"),3),
   ...choose(cardsDB.filter(x=>x.r==="Эпическая"),2),
   ...choose(cardsDB.filter(x=>x.r==="Легендарная"),1)
  ];
 }

 if(type==="tiktok"){

  result=[
   ...choose(cardsDB.filter(x=>x.r==="Обычная"),4),
   ...choose(cardsDB.filter(x=>x.r==="Редкая"),3),
   ...choose(cardsDB.filter(x=>x.r==="Эпическая"),2),
   ...choose(cardsDB.filter(x=>x.r==="Легендарная"),1),
   ...choose(cardsDB.filter(x=>x.r==="Лимитированная"),1)
  ];
 }

 state.cards.push(...result);
 save();

 modal(`
  <button class="close" onclick="closeModal()">×</button>
  <h2>Пак открыт 🎉</h2>
  <p class="muted">Получено карт: ${result.length}</p>

  <div class="grid">
   ${result.map(cardHTML).join("")}
  </div>

  <button class="btn" style="width:100%;margin-top:12px" onclick="closeModal();openPage('cards')">
   Забрать
  </button>
 `);
}

function cardHTML(c){

 return `
 <div class="card">
  <div class="cardArt">${c.e}</div>
  <div class="cardName">${c.n}</div>
  <div class="rarity ${rarityClass(c.r)}">${c.r}</div>
  <div class="cardMeta">POWER ${c.p}</div>
 </div>
 `;
}

function cards(){

 screen.innerHTML=`

 <h1>Карты</h1>
 <div class="muted">${state.cards.length} карт в коллекции</div>

 <div class="section"><h2>Открыть пак</h2></div>

 <div class="grid">
  ${pack("🎁","Daily Pack","9 обычных + 1 редкая","Бесплатно","daily")}
  ${pack("📦","Classic Pack","4 обычные · 3 редкие · 2 эпик · 1 лега","100 ⭐","classic")}
  ${pack("🎵","TikTok Pack","4 обычные · 3 редкие · 2 эпик · 1 лега · 1 лимитка","150 ⭐","tiktok")}
 </div>

 <div class="section">
  <h2>Моя коллекция</h2>
 </div>

 <div class="grid">
  ${
   state.cards.length
   ?state.cards.map(cardHTML).join("")
   :`<div class="box" style="grid-column:1/-1">Открой первый пак, чтобы получить карты.</div>`
  }
 </div>
 `;
}

function battle(){

 screen.innerHTML=`

 <h1>Батлы</h1>
 <div class="muted">Сражайся за Coins и Stars</div>

 <div class="stats">
  <div class="stat"><small>ПОБЕДЫ</small><b>${state.wins}</b></div>
  <div class="stat"><small>БОЕВ</small><b>${state.battles}</b></div>
  <div class="stat"><small>WINRATE</small><b>${Math.round(state.wins/state.battles*100)}%</b></div>
 </div>

 ${battleMode("⚔️","Дуэль 1-на-1","1 карта · 20 ⭐","duel")}
 ${battleMode("🏆","Турнир 8 игроков","Вход · 50 ⭐","tournament")}
 ${battleMode("💥","Royal Rumble","До 10 игроков","rumble")}
 ${battleMode("🛡️","Клановый батл","5 карт против клана","clan")}

 <div class="section"><h2>Турниры</h2></div>

 <div class="menu" onclick="openPage('tournaments')">
  <div class="menuInfo">
   <b>🏆 Все турниры</b>
   <span>Ежедневные · недельные · сезонные</span>
  </div>
  <button class="btn dark">›</button>
 </div>

 <div class="section"><h2>Мой клан</h2></div>

 <div class="box">
  <h2>🛡️ ${state.clan}</h2>
  <p class="muted">24 участника · рейтинг #18</p>
  <button class="btn dark" onclick="openPage('clans')">Открыть клан</button>
 </div>
 `;
}

function battleMode(icon,name,desc,type){

 return `
 <div class="menu">
  <div class="menuInfo">
   <b>${icon} ${name}</b>
   <span>${desc}</span>
  </div>

  <button class="btn" onclick="startBattle('${type}')">Играть</button>
 </div>
 `;
}

function startBattle(type){

 state.battles++;

 let chance=.5+Math.min(state.cards.length*.008,.25);
 let win=Math.random()<chance;

 if(win){

  state.wins++;
  state.coins+=type==="tournament"?1000:300;
  state.stars+=type==="tournament"?20:5;

  toast("🏆 Победа! Награда получена");
 }else{
  toast("Поражение. Попробуй ещё раз");
 }

 save();
 battle();
}

function market(){

 screen.innerHTML=`

 <h1>Рынок</h1>
 <div class="muted">Покупка и продажа карт · демо</div>

 <div class="tabs">
  <button class="tab active">Все</button>
  <button class="tab">Coins</button>
  <button class="tab">Stars</button>
  <button class="tab">Аукционы</button>
 </div>

 ${marketCard("🌟","Golden Legend","Легендарная","850 ⭐")}
 ${marketCard("🐺","Cyber Wolf","Редкая","2500 🪙")}
 ${marketCard("👑","Void King","Эпическая","1200 ⭐")}
 ${marketCard("🎵","TikTok Icon","Лимитированная","2500 ⭐")}

 <button class="btn" style="width:100%;margin-top:10px" onclick="sellCard()">
  + Выставить карту

function marketCard(icon,name,rarity,price){

 return `
 <div class="menu">
  <div class="menuInfo">
   <b>${icon} ${name}</b>
   <span>${rarity} · продавец #${Math.floor(Math.random()*9000+1000)}</span>
  </div>

  <button class="btn" onclick="buyMarket('${price}')">${price}</button>
 </div>
 `;
}

function buyMarket(price){

 const amount=parseInt(price.replace(/\D/g,""));
 const stars=price.includes("⭐");

 if(stars){

  if(state.stars<amount){
   toast("Недостаточно Stars");
   return;
  }

  state.stars-=amount;

 }else{

  if(state.coins<amount){
   toast("Недостаточно Coins");
   return;
  }

  state.coins-=amount;
 }

 state.cards.push(cardsDB[Math.floor(Math.random()*cardsDB.length)]);

 save();
 toast("Карта куплена");
 market();
}

function sellCard(){

 if(!state.cards.length){
  toast("Нет карт для продажи");
  return;
 }

 state.cards.pop();
 state.coins+=500;

 save();

 toast("Карта продана за 500 Coins");
 market();
}

function taskHTML(x){

   ${done?"✓":"Забрать"}
  </button>
 </div>
 `;
}

function completeTask(id){

 if(state.completed.includes(id)){
  toast("Уже получено");
  return;
 }

 const rewards={

  2:[0,50],
  3:[300,0],
  4:[200,0],
  5:[0,100],
  6:[0,250],
  7:[0,1000],
  8:[0,500]
 };

 state.coins+=rewards[id][0];
 state.stars+=rewards[id][1];
 state.completed.push(id);

 save();

 toast("🎉 Награда получена");
 tasks();
}

function requestWithdraw(){

 const amount=parseInt(document.getElementById("withdrawAmount").value);

 if(!amount||amount<1000||amount>state.stars){
  toast("Некорректная сумма");
  return;
 }

 state.stars-=amount;

 save();

 closeModal();

 toast("Заявка создана в демо");
}

function activatePromo(){

 const code=document.getElementById("promoInput").value.trim().toUpperCase();

 const rewards={
  STAR100:100,
  WELCOME:250,
  TIKTOK:150
 };

 if(state.promoUsed.includes(code)){
  toast("Код уже использован");
  return;
 }

 if(!rewards[code]){
  toast("Промокод не найден");
  return;
 }

 state.stars+=rewards[code];
 state.promoUsed.push(code);

 save();

 closeModal();

 toast("+"+rewards[code]+" Stars");
}

function adminRemoveStars(){

 const n=parseInt(document.getElementById("adminStars").value)||0;

 state.stars=Math.max(0,state.stars-n);

 admin();
}
